name: Build Windows desktop pet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and assets
        uses: actions/checkout@v4

      - name: Build, verify and package
        shell: powershell
        run: ./scripts/build.ps1 -SelfTest

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Naiwa-Windows-x64
          path: dist/Naiwa-Windows-x64.zip
          if-no-files-found: error

      - name: Upload verification report and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naiwa-verification
          path: work/self-test/
          if-no-files-found: warn
